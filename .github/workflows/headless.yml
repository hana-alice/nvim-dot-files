name: headless

# Phase G: gate every push and PR on the same two scripts the maintainer
# runs locally before commit. Three platforms in parallel proves the
# Phase A driver split + the platform-neutral bits actually work outside
# the maintainer's Windows host.

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  smoke:
    name: ${{ matrix.os }} / nvim ${{ matrix.nvim }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        nvim: [stable]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - name: Print versions
        shell: bash
        run: |
          nvim --version | head -1
          uname -a 2>/dev/null || echo "windows host"

      - name: Lint — no bare globals
        shell: bash
        run: nvim -l scripts/lint_no_bare_globals.lua

      - name: Headless smoke
        shell: bash
        run: nvim -l scripts/headless_smoke.lua
