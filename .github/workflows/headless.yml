name: headless

# Run the same unfiltered regression entrypoint used locally on each real host.

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  smoke:
    name: ${{ matrix.os }} / nvim ${{ matrix.nvim }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # stdpath(config) must point at this checkout on both Windows and POSIX.
      # Keep installation and startup-probe writes inside the disposable job.
      XDG_CONFIG_HOME: ${{ github.workspace }}
      XDG_DATA_HOME: ${{ github.workspace }}/.data
      XDG_STATE_HOME: ${{ github.workspace }}/.state
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      LOCALAPPDATA: ${{ github.workspace }}
      # Windows is the mandatory LLVM acceptance lane. Other real hosts report
      # explicit skips when the matching native tools are unavailable.
      NVIM_TEST_REQUIRE_NATIVE: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
    defaults:
      run:
        working-directory: nvim
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        nvim: [stable]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: nvim

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - name: Python for generator regression fixtures
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Go for the existing cindex tool
        uses: actions/setup-go@v5
        with:
          go-version-file: nvim/tools/cindex-uefilter/go.mod
          cache-dependency-path: nvim/tools/cindex-uefilter/go.sum

      - name: Windows parser compiler environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Existing Tree-sitter CLI prerequisite
        shell: bash
        run: npm install --global tree-sitter-cli@0.26.3

      - name: Existing search prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep fd-find

      - name: Existing LLVM 22.1.5 toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-22.1.5-win64.exe'
          $llvmRoot = Join-Path $env:RUNNER_TEMP 'llvm-22.1.5'
          Invoke-WebRequest 'https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.5/LLVM-22.1.5-win64.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne 'faf0e0795ea91913d29856b3efcb178f2349e5137ae06eec4c96af8eda4565d8') {
            throw 'LLVM installer checksum mismatch'
          }
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$llvmRoot") -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "LLVM installer failed: $($install.ExitCode)" }
          Remove-Item -LiteralPath $installer
          & "$llvmRoot/bin/clangd.exe" --version
          & "$llvmRoot/bin/clang.exe" --version
          if (!(Test-Path "$llvmRoot/bin/libclang.dll") -or !(Test-Path "$llvmRoot/lib/clang/22/include")) {
            throw 'LLVM native prerequisites missing'
          }
          "UE_CLANGD=$llvmRoot/bin/clangd.exe" >> $env:GITHUB_ENV
          "$llvmRoot/bin" >> $env:GITHUB_PATH

      - name: Existing ripgrep prerequisite (macOS)
        if: runner.os == 'macOS'
        run: command -v rg || brew install ripgrep

      - name: Existing ripgrep prerequisite (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y --no-progress

      - name: Bootstrap locked plugins and syntax parsers
        run: nvim --headless -l scripts/bootstrap_headless_ci.lua

      - name: Print versions
        shell: bash
        run: |
          nvim --version | head -1
          uname -a 2>/dev/null || echo "windows host"

      - name: Lint — no bare globals
        shell: bash
        run: nvim -l scripts/lint_no_bare_globals.lua

      - name: Headless smoke
        shell: bash
        run: nvim -l scripts/headless_smoke.lua

      - name: Full headless regression
        run: nvim --headless -l tests/run.lua

      - name: cindex regression
        working-directory: nvim/tools/cindex-uefilter
        run: go test -p 1 ./...
